services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:?Copy .env.example to .env and set PGDATABASE}
      POSTGRES_USER: ${PGUSER:?Copy .env.example to .env and set PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set a strong local password in .env}
    ports:
      - "127.0.0.1:${PGPORT:-5433}:5432"
    volumes:
      - patient_flow_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  patient_flow_pgdata:
